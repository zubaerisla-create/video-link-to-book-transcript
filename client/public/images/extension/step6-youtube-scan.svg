<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%" style="background:#FFFDF8; border-radius:16px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#292522" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Step Header Banner -->
  <rect x="24" y="20" width="712" height="44" rx="10" fill="#F8DDE8" fill-opacity="0.5" stroke="#E9A9C3" stroke-width="1"/>
  <text x="44" y="47" font-size="14" font-weight="bold" fill="#292522">ধাপ ৬: ইউটিউব ভিডিও চলাকালীন এক্সটেনশনে ক্লিক করে প্রিভিউ দেখুন</text>
  <text x="560" y="47" font-size="12" font-weight="600" fill="#77716D">Step 6 • YouTube Preview</text>

  <!-- Left: YouTube Video Simulation -->
  <g transform="translate(48, 85)" filter="url(#shadow6)">
    <rect width="360" height="260" rx="14" fill="#0F0F0F"/>
    
    <!-- Video Player Screen -->
    <rect x="0" y="0" width="360" height="180" rx="14" fill="#1F1F1F"/>
    <circle cx="180" cy="90" r="28" fill="#FF0000"/>
    <polygon points="174,78 192,90 174,102" fill="#FFFFFF"/>
    
    <!-- Video Metadata Below Player -->
    <text x="16" y="205" font-size="13" font-weight="bold" fill="#FFFFFF">How To Build High-Scale Systems</text>
    <text x="16" y="224" font-size="11" fill="#AAAAAA">Tech Academy • 450K views</text>
    
    <!-- YouTube Native "Show Transcript" Indicator -->
    <rect x="16" y="234" width="120" height="18" rx="4" fill="#333333"/>
    <text x="24" y="247" font-size="10" fill="#E9A9C3">📝 Show transcript</text>
  </g>

  <!-- Right: Transcriptly Popup Window Simulation -->
  <g transform="translate(435, 75)" filter="url(#shadow6)">
    <rect width="280" height="280" rx="16" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.5"/>
    
    <!-- Popup Header -->
    <rect width="280" height="48" rx="16" fill="#FFFDF8" stroke="#F0E8E2" stroke-width="1"/>
    <circle cx="28" cy="24" r="14" fill="#F8DDE8"/>
    <text x="28" y="29" text-anchor="middle" font-size="13">📚</text>
    <text x="50" y="22" font-size="13" font-weight="bold" fill="#292522">Transcriptly</text>
    <text x="50" y="36" font-size="10" fill="#77716D">Free Transcript Importer</text>

    <!-- Badges Row -->
    <g transform="translate(16, 60)">
      <rect width="78" height="22" rx="6" fill="#FFF1B8"/>
      <text x="39" y="15" text-anchor="middle" font-size="10" font-weight="bold" fill="#292522">420 segments</text>

      <rect x="84" width="78" height="22" rx="6" fill="#FAF4EC"/>
      <text x="123" y="15" text-anchor="middle" font-size="10" font-weight="bold" fill="#77716D">~5,200 words</text>

      <rect x="168" width="78" height="22" rx="6" fill="#F8DDE8"/>
      <text x="207" y="15" text-anchor="middle" font-size="10" font-weight="bold" fill="#7C3AED">Bangla / En</text>
    </g>

    <!-- Snippet Preview Box -->
    <rect x="16" y="92" width="248" height="98" rx="8" fill="#FAF4EC" stroke="#E8DACB" stroke-width="1"/>
    <text x="26" y="110" font-size="10" font-weight="bold" fill="#77716D">Transcript Snippet:</text>
    <text x="26" y="128" font-size="10" font-family="monospace" fill="#292522">[0:00] Welcome to this video.</text>
    <text x="26" y="146" font-size="10" font-family="monospace" fill="#292522">[0:04] Today we learn how to...</text>
    <text x="26" y="164" font-size="10" font-family="monospace" fill="#292522">[0:08] build systems from scratch.</text>
    <text x="26" y="180" font-size="10" font-family="monospace" fill="#77716D">...</text>

    <!-- Big Action Button (Import to Transcriptly) -->
    <rect x="16" y="202" width="248" height="42" rx="10" fill="#7C3AED"/>
    <text x="140" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">📥 Import to Transcriptly</text>
    <text x="140" y="260" text-anchor="middle" font-size="10" font-weight="600" fill="#7C3AED">Click to read as a digital book ➔</text>
  </g>
</svg>
