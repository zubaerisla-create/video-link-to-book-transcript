<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%" style="background:#FFFDF8; border-radius:16px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#292522" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Step Header Banner -->
  <rect x="24" y="20" width="712" height="44" rx="10" fill="#F8DDE8" fill-opacity="0.5" stroke="#E9A9C3" stroke-width="1"/>
  <text x="44" y="47" font-size="14" font-weight="bold" fill="#292522">ধাপ ৪: "Load unpacked" বাটনে ক্লিক করে ফোল্ডারটি সিলেক্ট করুন</text>
  <text x="560" y="47" font-size="12" font-weight="600" fill="#77716D">Step 4 • Load Unpacked</text>

  <!-- Chrome Action Bar Simulation -->
  <g transform="translate(48, 85)" filter="url(#shadow4)">
    <rect width="664" height="260" rx="14" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.5"/>
    
    <!-- Top Action Bar -->
    <rect width="664" height="64" rx="14" fill="#FFFFFF" stroke="#F0E8E2" stroke-width="1"/>

    <!-- 1. Load Unpacked Button with Highlighting Glow -->
    <g transform="translate(24, 12)">
      <rect width="160" height="40" rx="8" fill="#E9A9C3" stroke="#DE91B1" stroke-width="2"/>
      <path d="M22 25 v-10 h16 v10 M18 20 l12 -6 l12 6" fill="none" stroke="#292522" stroke-width="2" stroke-linecap="round"/>
      <text x="48" y="25" font-size="13" font-weight="bold" fill="#292522">Load unpacked</text>
    </g>

    <!-- Other Secondary Buttons -->
    <rect x="196" y="16" width="130" height="32" rx="6" fill="#FFFDF8" stroke="#F0E8E2" stroke-width="1"/>
    <text x="214" y="36" font-size="12" fill="#77716D">Pack extension</text>

    <rect x="336" y="16" width="100" height="32" rx="6" fill="#FFFDF8" stroke="#F0E8E2" stroke-width="1"/>
    <text x="356" y="36" font-size="12" fill="#77716D">Update</text>

    <!-- Big Callout Arrow to Load Unpacked -->
    <g transform="translate(45, 68)">
      <path d="M50 40 L50 0" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
      <polygon points="44,8 50,0 56,8" fill="#7C3AED"/>
      <rect x="0" y="40" width="220" height="32" rx="8" fill="#292522"/>
      <text x="110" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">১. এই বাটনে ক্লিক করুন</text>
    </g>

    <!-- Folder Selection Modal Simulation -->
    <g transform="translate(270, 75)" filter="url(#shadow4)">
      <rect width="365" height="155" rx="12" fill="#FAF4EC" stroke="#E8DACB" stroke-width="1.5"/>
      <rect width="365" height="34" rx="12" fill="#ECDCC9" fill-opacity="0.6"/>
      <text x="16" y="22" font-size="12" font-weight="bold" fill="#433422">📁 Select Extension Directory</text>
      
      <!-- Selected Folder Row (Active) -->
      <g transform="translate(16, 46)">
        <rect width="333" height="42" rx="8" fill="#FFF1B8" stroke="#E9A9C3" stroke-width="1.5"/>
        <text x="14" y="26" font-size="13" font-weight="bold" fill="#292522">📁 transcriptly-extension</text>
        <rect x="235" y="8" width="86" height="26" rx="6" fill="#7C3AED"/>
        <text x="278" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">✓ Select</text>
      </g>

      <text x="24" y="112" font-size="11" fill="#77716D">ফোল্ডারের ভেতরে manifest.json ফাইলটি থাকলেই ক্রোম</text>
      <text x="24" y="130" font-size="11" font-weight="bold" fill="#292522">এক্সটেনশনটি সক্রিয় করে নেবে।</text>
    </g>
  </g>
</svg>
