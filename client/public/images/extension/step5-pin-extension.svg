<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%" style="background:#FFFDF8; border-radius:16px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#292522" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Step Header Banner -->
  <rect x="24" y="20" width="712" height="44" rx="10" fill="#F8DDE8" fill-opacity="0.5" stroke="#E9A9C3" stroke-width="1"/>
  <text x="44" y="47" font-size="14" font-weight="bold" fill="#292522">ধাপ ৫: ব্রাউজারের উপরে পিন (Pin) করুন যাতে সবসময় দেখতে পান</text>
  <text x="560" y="47" font-size="12" font-weight="600" fill="#77716D">Step 5 • Pin to Toolbar</text>

  <!-- Browser Toolbar Simulation -->
  <g transform="translate(48, 85)" filter="url(#shadow5)">
    <rect width="664" height="260" rx="14" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.5"/>
    
    <!-- Chrome Toolbar Strip -->
    <rect width="664" height="52" rx="14" fill="#F5EBE1" fill-opacity="0.8"/>
    
    <!-- URL Bar -->
    <rect x="24" y="10" width="450" height="32" rx="8" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1"/>
    <text x="40" y="30" font-size="12" fill="#77716D">https://www.youtube.com</text>

    <!-- Toolbar Icons on Right -->
    <g transform="translate(490, 10)">
      <!-- Standard Icon -->
      <circle cx="20" cy="16" r="14" fill="#FFFFFF" stroke="#E8DACB"/>
      <text x="20" y="21" text-anchor="middle" font-size="13">⭐</text>

      <!-- Extensions Puzzle Piece (Active) -->
      <circle cx="60" cy="16" r="16" fill="#FFF1B8" stroke="#E9A9C3" stroke-width="2"/>
      <text x="60" y="22" text-anchor="middle" font-size="16">🧩</text>

      <!-- Pinned Transcriptly Icon -->
      <rect x="92" y="2" width="28" height="28" rx="6" fill="#F8DDE8" stroke="#E9A9C3" stroke-width="1.5"/>
      <text x="106" y="21" text-anchor="middle" font-size="14">📚</text>
    </g>

    <!-- Extensions Menu Dropdown Card -->
    <g transform="translate(380, 56)" filter="url(#shadow5)">
      <rect width="265" height="175" rx="12" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.5"/>
      
      <!-- Dropdown Header -->
      <text x="16" y="26" font-size="13" font-weight="bold" fill="#292522">Extensions</text>
      <line x1="0" y1="36" x2="265" y2="36" stroke="#F0E8E2" stroke-width="1"/>

      <!-- Transcriptly Row (Highlighted) -->
      <g transform="translate(8, 46)">
        <rect width="249" height="52" rx="8" fill="#FFF1B8" fill-opacity="0.5" stroke="#E9A9C3" stroke-width="1.5"/>
        <rect x="10" y="10" width="32" height="32" rx="6" fill="#E9A9C3"/>
        <text x="26" y="31" text-anchor="middle" font-size="16">📚</text>
        
        <text x="50" y="24" font-size="12" font-weight="bold" fill="#292522">Transcriptly</text>
        <text x="50" y="38" font-size="10" fill="#77716D">Free YouTube Importer</text>

        <!-- Pin Button (Highlighted) -->
        <circle cx="225" cy="26" r="14" fill="#7C3AED"/>
        <text x="225" y="31" text-anchor="middle" font-size="14" fill="#FFFFFF">📌</text>
      </g>

      <!-- Another Dummy Row -->
      <g transform="translate(8, 108)">
        <rect width="249" height="42" rx="6" fill="#FFFDF8"/>
        <circle cx="26" cy="21" r="12" fill="#F5EBE1"/>
        <text x="26" y="25" text-anchor="middle" font-size="12">⚙️</text>
        <text x="48" y="25" font-size="12" fill="#77716D">Other Extension</text>
        <text x="225" y="26" text-anchor="middle" font-size="13" fill="#A8A29E">📌</text>
      </g>
    </g>

    <!-- Callout on the left -->
    <g transform="translate(40, 95)">
      <rect width="310" height="110" rx="12" fill="#FAF4EC" stroke="#E8DACB" stroke-width="1"/>
      <text x="20" y="35" font-size="14" font-weight="bold" fill="#292522">📌 পিন করার সুবিধা:</text>
      <text x="20" y="60" font-size="12" fill="#433422">পিন করে রাখলে ইউটিউবে ভিডিও দেখার সময় সরাসরি</text>
      <text x="20" y="78" font-size="12" fill="#433422">১-ক্লিক করেই আপনি ক্যাপশন দেখতে পাবেন।</text>
      <text x="20" y="96" font-size="11" font-weight="bold" fill="#7C3AED">বারবার মেনুতে খুঁজতে হবে না!</text>
    </g>
  </g>
</svg>
